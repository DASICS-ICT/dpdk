###########################################################################
# Minimal ipsec-secgw-cdma-poc config — single DPDK port 0, no peer needed
# for Scenario 1 (CDMA reads SA key material after sa_init).
#
# Replace neigh MAC with your link peer if you later send real traffic; for
# key-only PoC it can stay dummy.
###########################################################################

sp ipv4 in esp protect 256 pri 1 dst 10.0.0.0/24 sport 0:65535 dport 0:65535
sp ipv4 out esp protect 256 pri 1 dst 10.1.0.0/24 sport 0:65535 dport 0:65535

sa in 256 cipher_algo aes-128-cbc cipher_key \
01:02:03:04:05:06:07:08:09:0a:0b:0c:0d:0e:0f:10 \
auth_algo sha1-hmac auth_key \
11:12:13:14:15:16:17:18:19:1a:1b:1c:1d:1e:1f:20:21:22:23:24 \
mode ipv4-tunnel src 192.0.2.2 dst 192.0.2.1

sa out 256 cipher_algo aes-128-cbc cipher_key \
01:02:03:04:05:06:07:08:09:0a:0b:0c:0d:0e:0f:10 \
auth_algo sha1-hmac auth_key \
11:12:13:14:15:16:17:18:19:1a:1b:1c:1d:1e:1f:20:21:22:23:24 \
mode ipv4-tunnel src 192.0.2.1 dst 192.0.2.2

rt ipv4 dst 192.0.2.0/30 port 0
rt ipv4 dst 10.0.0.0/24 port 0
rt ipv4 dst 10.1.0.0/24 port 0

neigh port 0 aa:bb:cc:dd:ee:01
